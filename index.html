<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Smart TV (Server-Side)</title>
    <style>
        /* --- CSS STYLES --- */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #player-div {
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Disables mouse interaction */
        }

        #tv-glass {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        /* Error / No Signal Screen */
        #error-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .show-error {
            display: flex !important;
        }

        /* Remote Control UI */
        #remote-control {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 140px;
            transition: opacity 0.3s;
            opacity: 0.3;
        }

        #remote-control:hover {
            opacity: 1;
        }

        .channel-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
        }

        .channel-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .channel-btn.active {
            background: #d32f2f;
            color: white;
        }

        #channel-display {
            position: absolute;
            top: 5vh;
            right: 5vw;
            font-size: 3vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            z-index: 15;
            text-shadow: 0 0 10px black;
            display: none;
        }
    </style>
</head>

<body>

    <div id="tv-frame">
        <div id="channel-display">CH 01</div>

        <div id="error-screen">
            <h1>NO SIGNAL</h1>
            <p>DOWNLOADING DATA...</p>
        </div>

        <div id="tv-glass"></div>

        <div id="player-div"></div>

        <div id="remote-control">
            <button class="channel-btn" onclick="toggleFullScreen()">⚡ FULLSCREEN</button>
            <div style="height:10px;"></div>
            <button class="channel-btn active" onclick="switchChannel(1)">01 NBA</button>
            <button class="channel-btn" onclick="switchChannel(2)">02 Comedy</button>
            <button class="channel-btn" onclick="playNextVideo()">⏭ SKIP</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        let channels = {
            1: [], // To be loaded from playlist.json
            2: ['dQw4w9WgXcQ', 'L_jWHffIx5E'] // Backup channel
        };

        let currentChannelId = 1;
        let currentVideoIndex = 0;
        let player;

        // --- 1. FETCH PLAYLIST (FROM LOCAL JSON FILE) ---
        async function loadPlaylistData() {
            console.log("Fetching playlist.json from server...");
            try {
                // Append timestamp to prevent browser caching
                const response = await fetch('playlist.json?t=' + new Date().getTime());

                if (!response.ok) throw new Error("File not found");

                const data = await response.json();

                if (data["1"] && data["1"].length > 0) {
                    channels[1] = data["1"];
                    console.log("Playlist loaded successfully:", channels[1]);
                }
            } catch (error) {
                console.warn("Could not load playlist.json (using backup):", error);
                // Backup IDs if file is missing
                channels[1] = ['dQw4w9WgXcQ'];
            }
        }

        // --- YOUTUBE API SETUP ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            // Load data first, then initialize player
            loadPlaylistData().then(() => {
                initPlayer();
            });
        }

        function initPlayer() {
            // Safe check: ensure channel 1 has at least one video
            let startVideo = (channels[1].length > 0) ? channels[1][0] : 'dQw4w9WgXcQ';

            player = new YT.Player('player-div', {
                videoId: startVideo,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // --- EVENT HANDLERS ---
        function onPlayerReady(event) {
            event.target.playVideo();
            showChannelDisplay("NBA TV");
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) playNextVideo();
        }

        function onPlayerError(event) {
            // Skip video if blocked
            if ([100, 101, 150].includes(event.data)) {
                toggleErrorMode(true);
                setTimeout(() => { playNextVideo(); }, 1500);
            }
        }

        // --- LOGIC ---
        function playNextVideo() {
            currentVideoIndex++;
            if (currentVideoIndex >= channels[currentChannelId].length) currentVideoIndex = 0;

            if (player && player.loadVideoById) {
                player.loadVideoById(channels[currentChannelId][currentVideoIndex]);
                toggleErrorMode(false);
            }
        }

        function switchChannel(id) {
            currentChannelId = id;
            currentVideoIndex = 0;
            showChannelDisplay(id === 1 ? "NBA" : "COMEDY");

            if (player) {
                toggleErrorMode(true);
                setTimeout(() => player.loadVideoById(channels[id][0]), 500);
                setTimeout(() => toggleErrorMode(false), 1000);
            }
        }

        // --- UI HELPERS ---
        function toggleErrorMode(show) {
            document.getElementById('error-screen').classList.toggle('show-error', show);
            document.getElementById('player-div').style.visibility = show ? 'hidden' : 'visible';
        }

        function showChannelDisplay(text) {
            let el = document.getElementById('channel-display');
            el.innerText = text;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- KEYBOARD CONTROLS ---
        document.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowRight' || event.key === 'ArrowUp') switchChannel(1);
            if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') switchChannel(2);
        });
    </script>
</body>

</html>
