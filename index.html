<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Smart TV (Server-Side)</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="tv-frame">
        <!-- Visual Bezel -->
        <div id="tv-bezel"></div>

        <!-- System OSD (Top Right: Power, Vol, Ch) -->
        <div id="osd-system">P</div>

        <!-- Content OSD (Bottom Center: Titles) -->
        <div id="osd-display">CH 01</div>

        <!-- Static Noise -->
        <div id="static-overlay"></div>

        <!-- Video Players Container -->
        <div id="players-container">
            <!-- Players will be injected here -->
        </div>

        <!-- Splash Screen Elements (Title & Remote) -->
        <div id="splash-title">
            <span>NBA</span>
            <span>NIGHT</span>
            <span>TV</span>
        </div>

        <!-- Neon Remote Wrapper (Hit Area) -->
        <!-- Wrapper stays fixed to capture hover, avoiding "shaking" when child moves -->
        <div id="remote-wrapper">
            <div id="remote-container">
                <div class="remote-screen">
                    <i class="fas fa-basketball-ball remote-icon"></i>
                </div>

                <div class="instructions">POWER</div>

                <div class="power-wrapper" onclick="togglePower()">
                    <i class="fas fa-power-off power-icon"></i>
                </div>
                <div class="status-led" id="led"></div>

                <div class="instructions">
                    POWER ON TO START
                    <span>SWIPE TO CHANGE CHANNEL</span>
                    <span>ARROWS: VOL / CH</span>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube API (Must load before app.js init logic kicks in fully, or handled by callback) -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>

</html>
