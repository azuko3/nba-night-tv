<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Smart TV (Server-Side)</title>
    <style>
        /* --- CSS STYLES --- */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            font-family: sans-serif;
        }

        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* The Blue/Retro TV Frame Overlay */
        #tv-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            /* High Z-index to overlay video */
            pointer-events: none;
            /* Let clicks pass through */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95), inset 0 0 20px 5px rgba(0, 80, 255, 0.5);
            /* Stronger blue glow */
            border: 8px solid #111;
            /* Thicker dark border */
        }

        #player-div {
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Disables mouse interaction with YouTube directly */
        }

        /* Splash Screen (TV OFF State) */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.5s;
        }

        #splash-screen h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 1;
            }

            5% {
                opacity: 0.8;
            }

            10% {
                opacity: 1;
            }

            15% {
                opacity: 0.3;
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }

        #start-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.5);
            transition: transform 0.2s;
            z-index: 101;
            /* Clickable */
            pointer-events: auto;
        }

        #start-btn:hover {
            transform: scale(1.1);
        }

        /* Static Noise Overlay (Hides Related Videos) */
        #static-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif');
            /* Static noise GIF */
            background-size: cover;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            /* Below bezel, above player */
            transition: opacity 0.2s;
        }

        /* Error / No Signal Screen */
        #error-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .show-error {
            display: flex !important;
        }

        /* Remote Control UI */
        #remote-control {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 200;
            /* Highest z-index to be clickable */
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 140px;
            transition: opacity 0.3s;
            opacity: 0.3;
        }

        #remote-control:hover {
            opacity: 1;
        }

        .channel-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
        }

        .channel-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .channel-btn.active {
            background: #d32f2f;
            color: white;
        }

        .power-btn {
            background: #d32f2f;
            color: white;
            text-align: center;
            margin-bottom: 5px;
        }

        .power-btn:hover {
            background: #b71c1c;
        }

        #channel-display {
            position: absolute;
            top: 5vh;
            right: 5vw;
            font-size: 3vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            z-index: 15;
            text-shadow: 0 0 10px black;
            display: none;
        }
    </style>
</head>

<body>

    <div id="tv-frame">
        <!-- Visual Bezel/Frame -->
        <div id="tv-bezel"></div>

        <!-- Splash Screen (OFF State) -->
        <div id="splash-screen">
            <h1>NBA NIGHT TV</h1>
            <button id="start-btn" onclick="togglePower()">POWER ON</button>
        </div>

        <!-- Error / Status Messages -->
        <div id="error-screen">
            <h1>NO SIGNAL</h1>
            <p>DOWNLOADING DATA...</p>
        </div>

        <div id="channel-display">CH 01</div>

        <!-- Static Overlay for transitions -->
        <div id="static-overlay"></div>

        <!-- Video Player -->
        <div id="player-div"></div>

        <!-- Remote Control -->
        <div id="remote-control">
            <button class="channel-btn power-btn" onclick="togglePower()">⏻ ON/OFF</button>
            <button class="channel-btn active" onclick="switchChannel(1)">01 NBA</button>
            <button class="channel-btn" onclick="switchChannel(2)">02 Comedy</button>
            <button class="channel-btn" onclick="playNextVideo()">⏭ SKIP</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        let channels = {
            1: [], // To be loaded from playlist.json
            2: ['dQw4w9WgXcQ', 'L_jWHffIx5E'] // Backup channel
        };

        let currentChannelId = 1;
        let currentVideoIndex = 0;
        let player;
        let isTVOn = false;

        // --- 1. FETCH PLAYLIST ---
        async function loadPlaylistData() {
            console.log("Fetching playlist.json from server...");
            try {
                const response = await fetch('playlist.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("File not found");
                const data = await response.json();
                if (data["1"] && data["1"].length > 0) {
                    channels[1] = data["1"];
                    console.log("Playlist loaded:", channels[1]);
                }
            } catch (error) {
                console.warn("Using backup playlist:", error);
                channels[1] = ['dQw4w9WgXcQ'];
            }
        }

        // --- YOUTUBE API SETUP ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            loadPlaylistData().then(() => {
                initPlayer();
            });
        }

        function initPlayer() {
            let startVideo = (channels[1].length > 0) ? channels[1][0] : 'dQw4w9WgXcQ';
            player = new YT.Player('player-div', {
                videoId: startVideo,
                playerVars: {
                    'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0,
                    'modestbranding': 1, 'rel': 0, 'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // --- POWER LOGIC ---
        function togglePower() {
            let splash = document.getElementById('splash-screen');

            if (!isTVOn) {
                // TURN ON
                isTVOn = true;
                splash.style.opacity = 0;
                setTimeout(() => splash.style.display = 'none', 500);
                if (player && player.playVideo) {
                    player.playVideo();
                    showChannelDisplay("NBA TV");
                }
            } else {
                // TURN OFF
                isTVOn = false;
                splash.style.display = 'flex';
                setTimeout(() => splash.style.opacity = 1, 10); // Fade in
                if (player && player.stopVideo) {
                    player.stopVideo(); // Stop playback
                }
                document.getElementById('start-btn').innerText = "POWER ON";
            }
        }

        // --- EVENT HANDLERS ---
        function onPlayerReady(event) {
            // Ready, waiting for user to click POWER ON
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                showStatic();
                playNextVideo();
            }
            if (event.data === YT.PlayerState.PLAYING) {
                hideStatic();
            }
        }

        function onPlayerError(event) {
            if ([100, 101, 150].includes(event.data)) {
                toggleErrorMode(true);
                setTimeout(() => { playNextVideo(); }, 1500);
            }
        }

        // --- LOGIC ---
        function playNextVideo() {
            if (!isTVOn) return;
            currentVideoIndex++;
            if (currentVideoIndex >= channels[currentChannelId].length) currentVideoIndex = 0;
            if (player && player.loadVideoById) {
                showStatic();
                player.loadVideoById(channels[currentChannelId][currentVideoIndex]);
                toggleErrorMode(false);
            }
        }

        function switchChannel(id) {
            if (!isTVOn) return;
            currentChannelId = id;
            currentVideoIndex = 0;
            showChannelDisplay(id === 1 ? "NBA" : "COMEDY");

            if (player) {
                showStatic();
                setTimeout(() => player.loadVideoById(channels[id][0]), 300);
            }
        }

        // --- UI HELPERS ---
        function showStatic() { document.getElementById('static-overlay').style.opacity = 0.5; }
        function hideStatic() { document.getElementById('static-overlay').style.opacity = 0; }

        function toggleErrorMode(show) {
            document.getElementById('error-screen').classList.toggle('show-error', show);
            document.getElementById('player-div').style.visibility = show ? 'hidden' : 'visible';
        }

        function showChannelDisplay(text) {
            let el = document.getElementById('channel-display');
            el.innerText = text;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // --- KEYBOARD CONTROLS ---
        document.addEventListener('keydown', function (event) {
            if (event.key === ' ' || event.key === 'Enter') togglePower(); // Space/Enter to Start/Stop
            if (!isTVOn) return;
            if (event.key === 'ArrowRight' || event.key === 'ArrowUp') switchChannel(1);
            if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') switchChannel(2);
        });
    </script>
</body>

</html>
