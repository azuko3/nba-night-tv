<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Smart TV (Server-Side)</title>
    <!-- FontAwesome for Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="tv-frame">
        <!-- Visual Bezel -->
        <div id="tv-bezel"></div>

        <!-- System OSD (Top Right: Power, Vol, Ch) -->
        <div id="osd-system">P</div>

        <!-- Content OSD (Bottom Center: Titles) -->
        <div id="osd-display">CH 01</div>

        <!-- Up Next OSD (Bottom Right: Teaser) -->
        <div id="osd-up-next"></div>

        <!-- Static Noise -->
        <div id="static-overlay"></div>

        <!-- Scan Lines (CRT effect) -->
        <div id="scanlines"></div>

        <!-- Boot Flash (CRT power-on) -->
        <div id="boot-flash"></div>

        <!-- Channel Badge (persistent corner indicator) -->
        <div id="channel-badge">
            <span id="badge-number">CH 1</span>
            <span id="badge-name">RECAPS</span>
        </div>

        <!-- Progress Bar -->
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <!-- Video Players Container -->
        <div id="players-container">
            <!-- Players will be injected here -->
        </div>

        <!-- Splash Screen Elements (Title & Remote) -->
        <div id="splash-title">
            <span>NBA</span>
            <span>NIGHT</span>
            <span>TV</span>
        </div>

        <!-- Neon Remote Wrapper (Hit Area) -->
        <div id="remote-wrapper">
            <div id="remote-container">

                <div class="remote-brand">
                    <div class="brand-subtitle">NBA NIGHT TELEVISION™</div>
                </div>

                <div class="remote-divider"></div>

                <div class="remote-power-label">POWER</div>
                <div class="power-wrapper" onclick="togglePower()">
                    <i class="fas fa-power-off power-icon"></i>
                </div>
                <div class="status-led" id="led"></div>

                <div class="remote-start-hint">POWER ON / HIT SPACE TO START</div>

                <div class="remote-divider"></div>

                <div class="remote-hints">
                    <div class="hint-row">
                        <span class="hint-keys">↑ ↓</span>
                        <span class="hint-label">SWITCH CHANNEL</span>
                    </div>
                    <div class="hint-row">
                        <span class="hint-keys">← →</span>
                        <span class="hint-label">VOLUME CONTROL</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- YouTube API (Must load before app.js init logic kicks in fully, or handled by callback) -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- App Logic -->
    <script src="scripts/teams.js"></script>
    <script src="app.js"></script>
</body>

</html>
