<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Smart TV (Server-Side)</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS STYLES --- */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* --- PLAYERS --- */
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            /* Hidden by default, strictly enforced by parent state below */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }

        /* STRICT VISIBILITY LOGIC */
        /* Only show active player IF the TV is actually ON */
        #tv-frame.tv-on .video-player.active {
            opacity: 1;
            z-index: 2;
        }

        /* If TV is OFF, force ALL players hidden */
        #tv-frame:not(.tv-on) .video-player {
            opacity: 0 !important;
            visibility: hidden;
        }

        /* Legacy rule removal/update */
        .video-player.active {
            /* No longer sufficient on its own */
        }

        /* --- UI LAYERS --- */
        #tv-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95), inset 0 0 20px 5px rgba(0, 80, 255, 0.5);
            border: 8px solid #111;
        }

        #static-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif');
            background-size: cover;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.3s;
        }

        #osd-display {
            position: absolute;
            top: 10%;
            right: 5%;
            font-size: 2rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            z-index: 100;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            display: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        /* --- SPLASH SCREEN TITLE --- */
        #splash-title {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
        }

        #splash-title span {
            display: block;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
            animation: flicker 4s infinite alternate;
        }

        #splash-title span:nth-child(2) {
            color: #ff00ff;
            text-shadow:
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 40px #ff00ff,
                0 0 80px #ff00ff;
            font-size: 6rem;
            /* Slightly larger "NIGHT" */
        }

        /* Auto-hide Title when playing */
        .tv-playing #splash-title {
            opacity: 0;
            transform: translate(-50%, -60%) scale(1.1);
        }

        @keyframes flicker {

            0%,
            18%,
            22%,
            25%,
            53%,
            57%,
            100% {
                opacity: 1;
                filter: blur(0px);
            }

            20%,
            24%,
            55% {
                opacity: 0.8;
                filter: blur(1px);
            }
        }

        /* --- NEON REMOTE (CENTERED) --- */
        #remote-container {
            position: absolute;
            position: absolute;
            top: 65%;
            /* Moved down to make room for title */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border-radius: 30px;
            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.8),
                inset 0 0 2px rgba(255, 255, 255, 0.1),
                0 0 0 1px #222;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s, transform 0.5s;
        }

        /* Mini Remote State (When Playing) */
        .tv-playing #remote-container {
            /* Dock to Top-Left */
            top: 20px;
            left: 20px;
            transform: scale(0.6);
            /* Shrink significantly */
            transform-origin: top left;
            /* Anchor to corner */
            opacity: 0.3;
            /* Ghosted */
            pointer-events: auto;
            /* Still clickable */
            background: rgba(26, 26, 26, 0.8);
            /* More transparent bg */
        }

        /* Hover behavior for Mini Remote */
        .tv-playing #remote-container:hover {
            opacity: 1;
            transform: scale(0.65);
            /* Slight pop on hover */
            background: #1a1a1a;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        /* Clean up clutter in Mini Mode */
        .tv-playing .instructions {
            display: none;
        }

        /* Adjust remote screen in mini mode for better visibility */
        .tv-playing .remote-screen {
            height: 60px;
            /* Compress height */
            margin-bottom: 5px;
        }

        /* Initial State (Centered) */
        /* See #remote-container definition above */

        /* Remote "Screen" */
        .remote-screen {
            width: 140px;
            height: 100px;
            background: #000;
            border-radius: 15px;
            border: 2px solid #333;
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .remote-screen::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 15px;
            padding: 2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
        }

        .remote-icon {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 5px #ff00ff);
        }

        /* Power Button */
        .power-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                inset 0 0 10px #000,
                0 0 5px rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .power-wrapper:active {
            transform: scale(0.95);
        }

        .power-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            z-index: -1;
            filter: blur(5px);
            opacity: 0.6;
        }

        .power-icon {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* Instructions */
        .instructions {
            text-align: center;
            color: #666;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .instructions span {
            display: block;
            margin-top: 5px;
            color: #444;
        }

        /* Status Light */
        .status-led {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            box-shadow: 0 0 2px #000;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .tv-on .status-led {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            #remote-container {
                width: 260px;
            }

            #osd-display {
                font-size: 1.5rem;
                top: 5%;
            }
        }
    </style>
</head>

<body>

    <div id="tv-frame">
        <!-- Visual Bezel -->
        <div id="tv-bezel"></div>

        <!-- OSD -->
        <div id="osd-display">CH 01</div>

        <!-- Static Noise -->
        <div id="static-overlay"></div>

        <!-- Video Players Container -->
        <div id="players-container">
            <!-- Players will be injected here -->
        </div>

        <!-- Splash Screen Elements (Title & Remote) -->
        <div id="splash-title">
            <span>NBA</span>
            <span>NIGHT</span>
            <span>TV</span>
        </div>

        <!-- Neon Remote -->
        <div id="remote-container">
            <div class="remote-screen">
                <i class="fas fa-basketball-ball remote-icon"></i>
            </div>

            <div class="instructions">POWER</div>

            <div class="power-wrapper" onclick="togglePower()">
                <i class="fas fa-power-off power-icon"></i>
            </div>
            <div class="status-led" id="led"></div>

            <div class="instructions">
                POWER ON TO START
                <span>SWIPE TO CHANGE CHANNEL</span>
                <span>ARROWS: VOL / CH</span>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- STATE ---
        let isTVOn = false;
        let currentChannel = 1;
        let volume = 100;

        // Channel Data
        // 1: NBA, 2: Comedy (Backup)
        let playlistData = {
            1: ['_nxTNmM9lfY'], // Default fallback if fetch fails
            2: ['dQw4w9WgXcQ', 'L_jWHffIx5E']
        };

        // Player Instances
        let players = {};
        let playerStates = { 1: 0, 2: 0 }; // Current video index per channel

        // --- INITIALIZATION ---
        async function loadPlaylists() {
            try {
                const res = await fetch('playlist.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data["1"] && data["1"].length) playlistData[1] = data["1"];
                    if (data["2"] && data["2"].length) playlistData[2] = data["2"];
                }
            } catch (e) { console.warn("Fetch failed, using defaults"); }
        }

        function onYouTubeIframeAPIReady() {
            loadPlaylists().then(() => {
                createPlayer(1);
                createPlayer(2);
            });
        }

        function createPlayer(channelId) {
            // Create container
            let div = document.createElement('div');
            div.id = `player-${channelId}`;
            div.className = `video-player ${channelId === 1 ? 'active' : ''}`;
            document.getElementById('players-container').appendChild(div);

            let videoId = playlistData[channelId][0];

            players[channelId] = new YT.Player(`player-${channelId}`, {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0,
                    'modestbranding': 1, 'rel': 0, 'iv_load_policy': 3, 'mute': 1
                },
                events: {
                    'onReady': (e) => onPlayerReady(channelId, e),
                    'onStateChange': (e) => onPlayerStateChange(channelId, e)
                }
            });
        }

        // --- PLAYER EVENTS ---
        function onPlayerReady(id, event) {
            // Mute all initially. logic: only active unmuted IF tv is on.
            event.target.mute();
            // Try to verify playback to buffer it, but pause if TV is off.
            // If we want "Preloading", we let them play muted in background?
            // User said: "All iframes load... only active has sound".
            // To save bandwidth/CPU, maybe we pause them immediately after load, 
            // and only play when TV is ON.
            // BUT strict requirement: "Transitions... more natural".
            // Ideally: Play muted loop.
            event.target.playVideo();
        }

        function onPlayerStateChange(id, event) {
            // Loop logic
            if (event.data === YT.PlayerState.ENDED) {
                let nextIndex = (playerStates[id] + 1) % playlistData[id].length;
                playerStates[id] = nextIndex;
                players[id].loadVideoById(playlistData[id][nextIndex]);
            }
        }

        // --- POWER LOGIC ---
        function togglePower() {
            isTVOn = !isTVOn;
            let frame = document.getElementById('tv-frame');
            let led = document.getElementById('led');

            if (isTVOn) {
                frame.classList.add('tv-playing');
                frame.classList.add('tv-on');
                // Unmute active, ensuring others are muted
                updateAudioState();
                showOSD("POWER ON");
            } else {
                frame.classList.remove('tv-playing');
                frame.classList.remove('tv-on');
                // Mute all
                Object.values(players).forEach(p => p && p.mute && p.mute());
            }
        }

        function updateAudioState() {
            if (!isTVOn) return;
            Object.keys(players).forEach(key => {
                let p = players[key];
                if (p && p.unMute) {
                    if (parseInt(key) === currentChannel) {
                        p.unMute();
                        p.setVolume(volume);
                        if (typeof p.playVideo === 'function') p.playVideo(); // Force play on interaction (for mobile)
                    } else {
                        p.mute();
                    }
                }
            });
        }

        // --- CONTROLS ---
        function switchChannel(direction) { // 1 for next, -1 for prev
            if (!isTVOn) return;

            let oldCh = currentChannel;
            if (direction > 0) currentChannel = 2; // Simple toggle for 2 channels
            else currentChannel = 1;

            if (oldCh !== currentChannel) {
                // Visual Swap
                showStatic();
                setTimeout(() => {
                    document.getElementById(`player-${oldCh}`).classList.remove('active');
                    document.getElementById(`player-${currentChannel}`).classList.add('active');
                    updateAudioState();
                    hideStatic();
                    let name = currentChannel === 1 ? "NBA" : "COMEDY";
                    showOSD(`CH 0${currentChannel} ${name}`);
                }, 300);
            }
        }

        function adjustVolume(delta) {
            if (!isTVOn) return;
            volume = Math.max(0, Math.min(100, volume + delta));
            if (players[currentChannel]) players[currentChannel].setVolume(volume);
            showOSD(`VOL ${volume}%`);
        }

        function showOSD(text) {
            let osd = document.getElementById('osd-display');
            osd.innerText = text;
            osd.style.display = 'block';
            if (window.osdTimer) clearTimeout(window.osdTimer);
            window.osdTimer = setTimeout(() => osd.style.display = 'none', 2000);
        }

        function showStatic() { document.getElementById('static-overlay').style.opacity = 0.4; }
        function hideStatic() { document.getElementById('static-overlay').style.opacity = 0; }

        // --- INPUT HANDLING ---

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') togglePower();
            if (!isTVOn) return;

            if (e.code === 'ArrowUp') switchChannel(1);
            if (e.code === 'ArrowDown') switchChannel(-1);
            if (e.code === 'ArrowRight') adjustVolume(10);
            if (e.code === 'ArrowLeft') adjustVolume(-10);
        });

        // Touch / Swipe
        let touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        document.addEventListener('touchend', e => {
            if (!isTVOn) return;
            let touchEndY = e.changedTouches[0].clientY;
            let diff = touchStartY - touchEndY;

            if (Math.abs(diff) > 50) { // Threshold
                if (diff > 0) switchChannel(1); // Swipe Up -> Next
                else switchChannel(-1);        // Swipe Down -> Prev
            }
        }, { passive: false });

    </script>
</body>

</html>
