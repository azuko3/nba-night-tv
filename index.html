<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Smart TV (Server-Side)</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS STYLES --- */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* --- PLAYERS --- */
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            /* Hidden by default, strictly enforced by parent state below */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }

        /* STRICT VISIBILITY LOGIC */
        /* Only show active player IF the TV is actually ON */
        #tv-frame.tv-on .video-player.active {
            opacity: 1;
            z-index: 2;
        }

        /* If TV is OFF, force ALL players hidden */
        #tv-frame:not(.tv-on) .video-player {
            opacity: 0 !important;
            visibility: hidden;
        }



        /* --- UI LAYERS --- */
        #tv-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95), inset 0 0 20px 5px rgba(0, 80, 255, 0.5);
            border: 8px solid #111;
        }

        #static-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif');
            background-size: cover;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.3s;
        }

        #osd-display {
            position: absolute;
            top: 10%;
            right: 5%;
            font-size: 2rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            z-index: 100;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            display: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        /* --- SPLASH SCREEN TITLE --- */
        #splash-title {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
            transition: opacity 0.5s, transform 0.5s;
            pointer-events: none;
        }

        #splash-title span {
            display: block;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #00ffff;
            animation: flicker 4s infinite alternate;
        }

        #splash-title span:nth-child(2) {
            color: #ff00ff;
            text-shadow:
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 0 40px #ff00ff,
                0 0 80px #ff00ff;
            font-size: 6rem;
            /* Slightly larger "NIGHT" */
        }

        /* Auto-hide Title when playing */
        .tv-playing #splash-title {
            opacity: 0;
            transform: translate(-50%, -60%) scale(1.1);
        }

        @keyframes flicker {

            0%,
            18%,
            22%,
            25%,
            53%,
            57%,
            100% {
                opacity: 1;
                filter: blur(0px);
            }

            20%,
            24%,
            55% {
                opacity: 0.8;
                filter: blur(1px);
            }
        }

        /* --- NEON REMOTE STRUCTURE --- */

        /* 1. Wrapper: The positioning anchor & Hit Area */
        #remote-wrapper {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            transition: all 0.5s;
            /* Ensure it has size to contain the remote */
            width: 340px;
            height: auto;
            display: flex;
            justify-content: center;
        }

        /* 2. Container: The Visible Remote Card */
        #remote-container {
            width: 300px;
            padding: 20px;
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border-radius: 30px;
            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.8),
                inset 0 0 2px rgba(255, 255, 255, 0.1),
                0 0 0 1px #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- PLAYING STATE (SLIDING SIDEBAR) --- */

        /* Move the WRAPPER to the side to create the dock */
        .tv-playing #remote-wrapper {
            top: 20%;
            left: 0;
            transform: none;
            /* Reset center alignment */
            width: 60px;
            /* Small safe hit area triggered by mouse at edge */
            height: 300px;
            /* Vertical strip */
            justify-content: flex-start;
            /* Align remote to top-left of wrapper */
            overflow: visible;
            /* Allow remote to slide out */
        }

        /* Expand wrapper on hover so mouse doesn't lose it */
        .tv-playing #remote-wrapper:hover {
            width: 200px;
            /* Expand hit area to cover the slid-out remote */
        }

        /* The Remote itself in Mini Mode */
        .tv-playing #remote-container {
            width: 160px;
            padding: 10px;
            transform: scale(0.8) translateX(-130px);
            /* Hide it off screen to the left */
            transform-origin: top left;
            opacity: 0.6;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #333;
        }

        /* Slide IN when Wrapper is hovered */
        .tv-playing #remote-wrapper:hover #remote-container {
            transform: scale(0.9) translateX(0);
            /* Slide into view */
            opacity: 1;
            background: #111;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        /* Adjust screen element in mini mode */
        .tv-playing .remote-screen {
            height: 50px;
            width: 100%;
            margin-bottom: 5px;
            /* Make the icon pulsate or move on hover if desired */
        }

        /* Specific tweaks for the "Sliding Ball" effect requested */
        /* "The ball should be prominent... when hovering it moves right" */
        /* Currently the whole container moves. The User said: "If it's on left, it moves right exposing button" */
        /* The container logic above does exactly this (Left: -120px -> Left: 20px) */

        /* Initial State (Centered) */
        /* See #remote-container definition above */

        /* Remote "Screen" */
        .remote-screen {
            width: 140px;
            height: 100px;
            background: #000;
            border-radius: 15px;
            border: 2px solid #333;
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .remote-screen::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 15px;
            padding: 2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.8;
        }

        .remote-icon {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 5px #ff00ff);
        }

        /* Power Button */
        .power-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow:
                inset 0 0 10px #000,
                0 0 5px rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .power-wrapper:active {
            transform: scale(0.95);
        }

        .power-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            z-index: -1;
            filter: blur(5px);
            opacity: 0.6;
        }

        .power-icon {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff;
        }

        /* Instructions */
        .instructions {
            text-align: center;
            color: #666;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .instructions span {
            display: block;
            margin-top: 5px;
            color: #444;
        }

        /* Status Light */
        .status-led {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            box-shadow: 0 0 2px #000;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .tv-on .status-led {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            #remote-wrapper {
                width: 280px;
            }

            #remote-container {
                width: 100%;
            }

            #osd-display {
                font-size: 1.5rem;
                top: 5%;
            }
        }
    </style>
</head>

<body>

    <div id="tv-frame">
        <!-- Visual Bezel -->
        <div id="tv-bezel"></div>

        <!-- OSD -->
        <div id="osd-display">CH 01</div>

        <!-- Static Noise -->
        <div id="static-overlay"></div>

        <!-- Video Players Container -->
        <div id="players-container">
            <!-- Players will be injected here -->
        </div>

        <!-- Splash Screen Elements (Title & Remote) -->
        <div id="splash-title">
            <span>NBA</span>
            <span>NIGHT</span>
            <span>TV</span>
        </div>

        <!-- Neon Remote Wrapper (Hit Area) -->
        <!-- Wrapper stays fixed to capture hover, avoiding "shaking" when child moves -->
        <div id="remote-wrapper">
            <div id="remote-container">
                <div class="remote-screen">
                    <i class="fas fa-basketball-ball remote-icon"></i>
                </div>

                <div class="instructions">POWER</div>

                <div class="power-wrapper" onclick="togglePower()">
                    <i class="fas fa-power-off power-icon"></i>
                </div>
                <div class="status-led" id="led"></div>

                <div class="instructions">
                    POWER ON TO START
                    <span>SWIPE TO CHANGE CHANNEL</span>
                    <span>ARROWS: VOL / CH</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- STATE ---
        let isTVOn = false;
        let currentChannel = 1;
        let volume = 100;

        // Channel Data
        let playlistData = {
            1: ['_nxTNmM9lfY'],
            2: ['dQw4w9WgXcQ', 'L_jWHffIx5E']
        };

        // Player Architecture: 2 channels, each has 2 players (A/B) for double buffering
        // players[channelId] = { 'A': YT.Player, 'B': YT.Player }
        let players = {
            1: { A: null, B: null },
            2: { A: null, B: null }
        };

        let channelState = {
            1: { activeSlot: 'A', videoIndex: 0, nextPrepared: false }, // activeSlot: 'A' or 'B'
            2: { activeSlot: 'A', videoIndex: 0, nextPrepared: false }
        };

        let pollInterval = null;

        // Channel Data & Config
        let channelConfig = {
            1: { trimEnd: 11 }, // Cut 11 seconds from end (for NBA info cards)
            2: { trimEnd: 0 }
        };

        // --- INITIALIZATION ---
        async function loadPlaylists() {
            try {
                const res = await fetch('playlist.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data["1"] && data["1"].length) playlistData[1] = data["1"];
                    if (data["2"] && data["2"].length) playlistData[2] = data["2"];
                }
            } catch (e) { console.warn("Fetch failed, using defaults"); }
        }

        function onYouTubeIframeAPIReady() {
            loadPlaylists().then(() => {
                initChannel(1);
                initChannel(2);
                startPoller();
            });
        }

        function initChannel(id) {
            // Create A and B players
            createPlayerInstance(id, 'A', 0); // Load 1st video
            createPlayerInstance(id, 'B', 1); // Preload 2nd video
        }

        function createPlayerInstance(channelId, slot, vidIdx) {
            let container = document.getElementById('players-container');
            let divId = `player-${channelId}-${slot}`;

            let div = document.createElement('div');
            div.id = divId;
            // Only Channel 1 Slot A starts visible-ish (opacity handled by CSS active class)
            let isInitiallyActive = (channelId === 1 && slot === 'A');
            div.className = `video-player ${isInitiallyActive ? 'active' : ''}`;
            container.appendChild(div);

            // Safety check for index
            let vIds = playlistData[channelId];
            let safeIndex = vidIdx % vIds.length;
            let videoId = vIds[safeIndex];

            players[channelId][slot] = new YT.Player(divId, {
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3, // Strict: Hide video annotations
                    'mute': 1
                },
                events: {
                    'onReady': (e) => {
                        e.target.mute(); // Always start muted

                        // If it's the very first video of default channel (CH1), play with sound if TV ON
                        if (isTVOn && channelId === currentChannel && slot === channelState[channelId].activeSlot) {
                            e.target.unMute();
                            e.target.setVolume(volume);
                        }

                        e.target.playVideo();

                        // FIX: Pause background players so they don't run out!
                        // Only the active slot of the active channel should run immediately.
                        // Background players (Slot B or inactive channels) should buffer then pause.
                        if (!isInitiallyActive) {
                            setTimeout(() => {
                                e.target.pauseVideo();
                            }, 1500); // Allow 1.5s buffering then FREEZE
                        }
                    },
                    'onStateChange': (e) => {
                        // Poller handles transitions
                    }
                }
            });
        }

        // --- POLLER FOR SEAMLESS TRANSITIONS ---
        function startPoller() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                if (!isTVOn) return;

                // Check Active Channel status
                let chState = channelState[currentChannel];
                let currentSlot = chState.activeSlot;
                let activePlayer = players[currentChannel][currentSlot];

                if (activePlayer && activePlayer.getCurrentTime && activePlayer.getDuration) {
                    let now = activePlayer.getCurrentTime();
                    let duration = activePlayer.getDuration();

                    if (duration > 0) {
                        // Calculate Trigger Points
                        let trim = (channelConfig[currentChannel] && channelConfig[currentChannel].trimEnd) || 0;
                        // Minimum safety buffer of 0.2s if trim is 0
                        if (trim === 0) trim = 0.2;

                        let swapPoint = duration - trim;
                        let preStartPoint = swapPoint - 2; // Start next video 2s before swap

                        // 1. Trigger "Next" Start
                        if (now >= preStartPoint && !chState.nextPrepared) {
                            // Prepare Next Slot
                            let nextSlot = currentSlot === 'A' ? 'B' : 'A';
                            let nextPlayer = players[currentChannel][nextSlot];

                            // Start next video muted
                            if (nextPlayer) {
                                nextPlayer.mute();
                                nextPlayer.playVideo(); // RESUME from the pause
                                console.log("Pre-starting next video...");
                            }
                            chState.nextPrepared = true;
                        }

                        // 2. The Swap
                        if (now >= swapPoint) {
                            performSwap(currentChannel);
                        }
                    }
                }
            }, 200);
        }

        function performSwap(channelId) {
            let chState = channelState[channelId];
            let oldSlot = chState.activeSlot;
            let newSlot = oldSlot === 'A' ? 'B' : 'A';

            let oldPlayer = players[channelId][oldSlot];
            let newPlayer = players[channelId][newSlot];

            // 1. Visual Swap
            let newDiv = document.getElementById(`player-${channelId}-${newSlot}`);
            let oldDiv = document.getElementById(`player-${channelId}-${oldSlot}`);

            newDiv.classList.add('active');

            // 2. Audio Swap
            if (channelId === currentChannel && isTVOn) {
                newPlayer.unMute();
                newPlayer.setVolume(volume);
            }
            oldPlayer.mute();
            oldDiv.classList.remove('active');

            // 3. Update State
            chState.activeSlot = newSlot;
            chState.videoIndex = (chState.videoIndex + 1) % playlistData[channelId].length;
            chState.nextPrepared = false;

            // 4. Recycle Old Player (Load Next+1)
            let nextNextIndex = (chState.videoIndex + 1) % playlistData[channelId].length;
            let nextNextId = playlistData[channelId][nextNextIndex];

            setTimeout(() => {
                oldPlayer.stopVideo();
                oldPlayer.loadVideoById(nextNextId);
                // Background players: Play to buffer, then PAUSE
                oldPlayer.playVideo();
                oldPlayer.mute();
                setTimeout(() => oldPlayer.pauseVideo(), 1500); // The key fix
            }, 1000);
        }

        // --- POWER LOGIC ---
        function togglePower() {
            isTVOn = !isTVOn;
            let frame = document.getElementById('tv-frame');

            if (isTVOn) {
                frame.classList.add('tv-playing');
                frame.classList.add('tv-on');

                // Wake up active player
                let slot = channelState[currentChannel].activeSlot;
                let p = players[currentChannel][slot];
                if (p) { p.unMute(); p.setVolume(volume); p.playVideo(); }

                showOSD("POWER ON");
            } else {
                frame.classList.remove('tv-playing');
                frame.classList.remove('tv-on');
                // Mute all (but let them run or pause? User typically expects TV off = Silence)
                // We will MUTE them so they don't blast sound, but maybe keep running?
                // Usually Smart TVs pause content. Let's Pause to save bandwidth?
                // User said "Start straight away... run behind".
                // I'll just MUTE all.
                for (let c in players) {
                    if (players[c].A) players[c].A.mute();
                    if (players[c].B) players[c].B.mute();
                }
            }
        }

        // --- CONTROLS ---
        function switchChannel(direction) {
            if (!isTVOn) return;

            let oldCh = currentChannel;

            // Generic Looping Logic
            // Assuming channels are 1 and 2. 
            // 1 -> 2 -> 1
            if (direction > 0) {
                // Next
                currentChannel = (currentChannel === 1) ? 2 : 1;
            } else {
                // Prev
                currentChannel = (currentChannel === 1) ? 2 : 1;
            }

            // Only execute switch if channel actually changed (always true for 2 channels, but safe generic)
            if (oldCh !== currentChannel) {

                // Mute Old Channel FIRST
                let oldSlot = channelState[oldCh].activeSlot;
                players[oldCh][oldSlot].mute();

                showStatic();
                setTimeout(() => {
                    // Hide Old Channel Visuals
                    document.getElementById(`player-${oldCh}-A`).classList.remove('active');
                    document.getElementById(`player-${oldCh}-B`).classList.remove('active');

                    // Show New Channel Active Visual
                    let newSlot = channelState[currentChannel].activeSlot;
                    document.getElementById(`player-${currentChannel}-${newSlot}`).classList.add('active');

                    // Audio
                    let p = players[currentChannel][newSlot];
                    p.unMute(); p.setVolume(volume); p.playVideo();

                    hideStatic();
                    let name = currentChannel === 1 ? "NBA" : "COMEDY";
                    showOSD(`CH 0${currentChannel} ${name}`);
                }, 300);
            }
        }

        function adjustVolume(delta) {
            if (!isTVOn) return;
            volume = Math.max(0, Math.min(100, volume + delta));
            let slot = channelState[currentChannel].activeSlot;
            let p = players[currentChannel][slot];
            if (p) p.setVolume(volume);
            showOSD(`VOL ${volume}%`);
        }

        function showOSD(text) {
            let osd = document.getElementById('osd-display');
            osd.innerText = text;
            osd.style.display = 'block';
            if (window.osdTimer) clearTimeout(window.osdTimer);
            window.osdTimer = setTimeout(() => osd.style.display = 'none', 2000);
        }

        function showStatic() { document.getElementById('static-overlay').style.opacity = 0.4; }
        function hideStatic() { document.getElementById('static-overlay').style.opacity = 0; }

        // --- INPUT HANDLING ---
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') togglePower();
            if (!isTVOn) return;
            if (e.code === 'ArrowUp') switchChannel(1);
            if (e.code === 'ArrowDown') switchChannel(-1);
            if (e.code === 'ArrowRight') adjustVolume(10);
            if (e.code === 'ArrowLeft') adjustVolume(-10);
        });

        // Touch
        let touchStartY = 0;
        document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: false });
        document.addEventListener('touchend', e => {
            if (!isTVOn) return;
            let diff = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(diff) > 50) { if (diff > 0) switchChannel(1); else switchChannel(-1); }
        }, { passive: false });

    </script>
</body>

</html>
