<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Night TV - Fullscreen</title>
    <style>
        /* RESET & FULLSCREEN SETUP */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* No scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container covers the entire viewport */
        #tv-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* The YouTube Player fills the container */
        #player-div {
            width: 100%;
            height: 100%;
            pointer-events: none; /* No mouse interaction with video */
        }

        /* Transparent shield */
        #tv-glass {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        /* Error Screen */
        #error-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .show-error { display: flex !important; }

        /* --- REMOTE CONTROL UI --- */
        #remote-control {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6); /* More transparent */
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: opacity 0.3s, transform 0.3s;
            width: 140px;
        }

        /* Make remote settle when not used */
        #remote-control:hover { opacity: 1; transform: scale(1.02); }
        #remote-control { opacity: 0.3; } /* Dimmed when idle */

        .channel-btn {
            background: rgba(255,255,255,0.1);
            color: #ddd;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }

        .channel-btn:hover { background: rgba(255,255,255,0.3); color: #fff; }
        .channel-btn.active { background: #d32f2f; color: white; border-left: 4px solid #ff6659; } 

        .fs-btn {
            margin-top: 10px;
            background: #444;
            text-align: center;
            font-weight: bold;
            color: #ffcc00;
        }

        h3 { margin: 0 0 10px 0; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; text-align: center; }

        #channel-display {
            position: absolute;
            top: 5vh;
            right: 5vw;
            font-size: 3vw; /* Responsive font size */
            font-weight: 900;
            color: rgba(255,255,255,0.8);
            z-index: 15;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

<div id="tv-frame">
    <div id="channel-display">CH 01</div>

    <div id="error-screen">
        <h1 style="font-size: 4rem;">NO SIGNAL</h1>
        <p>SEARCHING SATELLITE...</p>
    </div>

    <div id="tv-glass"></div>
    <div id="player-div"></div>

    <div id="remote-control">
        <h3>CONTROLS</h3>
        <button class="channel-btn fs-btn" onclick="toggleFullScreen()">⚡ FULLSCREEN</button>
        <div style="height:10px;"></div> <button class="channel-btn active" onclick="switchChannel(1)">01 NBA</button>
        <button class="channel-btn" onclick="switchChannel(2)">02 Comedy</button>
        <button class="channel-btn" onclick="playNextVideo()">⏭ SKIP</button>
    </div>
</div>

<script>
    // --- CHANNELS DATA ---
    const channels = {
        1: ['mK02y5jHk14', 'I4C8B50Jc6Q', 'BROKEN_TEST', 'tgbNymZ7vqY'], 
        2: ['C0DPdy98e4c', 'L_jWHffIx5E', 'dQw4w9WgXcQ']
    };

    let currentChannelId = 1;
    let currentPlaylist = channels[1];
    let currentVideoIndex = 0;
    let player;
    
    // --- YOUTUBE API ---
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player-div', {
            videoId: currentPlaylist[currentVideoIndex],
            playerVars: {
                'autoplay': 1,
                'controls': 0,      
                'disablekb': 1,     
                'fs': 0,            
                'modestbranding': 1,
                'rel': 0,
                'showinfo': 0,
                'iv_load_policy': 3 // Hides video annotations
            },
            events: {
                'onReady': onPlayerReady,
                'onError': onPlayerError,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    // --- LOGIC ---

    function onPlayerReady(event) {
        event.target.playVideo();
        showChannelDisplay("NBA TV");
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            playNextVideo();
        }
    }

    function onPlayerError(event) {
        if ([100, 101, 150].includes(event.data)) {
            console.log("Error detected. Auto-skipping...");
            toggleErrorMode(true);
            setTimeout(() => { playNextVideo(); }, 2000); 
        }
    }

    function playNextVideo() {
        currentVideoIndex++;
        if (currentVideoIndex >= currentPlaylist.length) currentVideoIndex = 0;
        
        if (player && player.loadVideoById) {
            player.loadVideoById(currentPlaylist[currentVideoIndex]);
            toggleErrorMode(false);
        }
    }

    function switchChannel(channelId) {
        if (channels[channelId]) {
            currentChannelId = channelId;
            currentPlaylist = channels[channelId];
            currentVideoIndex = 0;

            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
            // Note: event.target might fail if called programmatically, but works on click
            // Simplified for this demo
            
            let name = channelId === 1 ? "NBA TV" : "COMEDY";
            showChannelDisplay(name);

            if (player && player.loadVideoById) {
                toggleErrorMode(true);
                setTimeout(() => {
                    player.loadVideoById(currentPlaylist[currentVideoIndex]);
                    toggleErrorMode(false);
                }, 800);
            }
        }
    }

    // --- FULLSCREEN LOGIC ---
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // --- UI HELPERS ---

    function toggleErrorMode(isError) {
        const errorScreen = document.getElementById('error-screen');
        const playerDiv = document.getElementById('player-div');
        
        if (isError) {
            playerDiv.style.visibility = 'hidden'; 
            errorScreen.classList.add('show-error');
        } else {
            playerDiv.style.visibility = 'visible';
            errorScreen.classList.remove('show-error');
        }
    }

    function showChannelDisplay(text) {
        const disp = document.getElementById('channel-display');
        disp.innerText = text;
        disp.style.display = 'block';
        setTimeout(() => { disp.style.display = 'none'; }, 3000);
    }

</script>
</body>
</html>
