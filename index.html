<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Skip Player (Final Version)</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        #video-container {
            position: relative;
            width: 800px;
            height: 450px; /* 16:9 Aspect Ratio */
            background: #111;
            overflow: hidden; /* Ensures nothing spills out */
        }

        /* The actual YouTube Player */
        #player-div {
            width: 100%;
            height: 100%;
        }

        /* The Error/Snow Screen */
        #error-screen {
            display: none; /* Hidden by default */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* Placeholder for Snow GIF later */
            color: white;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Helper class to toggle the error screen */
        .show-error {
            display: flex !important;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="error-screen">
        <h2>SIGNAL LOST</h2>
        <p>(Simulating Static Noise...)</p>
    </div>

    <div id="player-div"></div>
</div>

<script>
    // --- CONFIGURATION ---
    
    // Playlist: 
    // ID 1: Working
    // ID 2: BROKEN (Will trigger the skip logic)
    // ID 3: Working
    var playlist = [
        'dQw4w9WgXcQ',   
        'BROKEN_ID_123', 
        'tgbNymZ7vqY'    
    ];

    var currentVideoIndex = 0;
    var player;
    
    // --- YOUTUBE API SETUP ---
    
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player-div', {
            videoId: playlist[currentVideoIndex],
            playerVars: {
                'autoplay': 1,
                'controls': 1,
                'rel': 0
            },
            events: {
                'onReady': onPlayerReady,
                'onError': onPlayerError,       // CRITICAL: Handles the blocks
                'onStateChange': onPlayerStateChange // CRITICAL: Handles normal ending
            }
        });
    }

    // --- EVENT HANDLERS ---

    function onPlayerReady(event) {
        console.log("Player ready. Starting video.");
        event.target.playVideo();
    }

    // Handle normal video ending (when video finishes naturally)
    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            console.log("Video ended naturally.");
            playNextVideo();
        }
    }

    // Handle Errors (Region block, deleted video, etc.)
    function onPlayerError(event) {
        // Error Codes: 100, 101, 150 = Video not found or Blocked
        if ([100, 101, 150].includes(event.data)) {
            console.log("Error detected (Code " + event.data + "). Initiating skip sequence.");
            
            // Step 1: Hide the player & Show Error Screen
            // This ensures we NEVER see the YouTube suggestions
            toggleErrorMode(true);

            // Step 2: Wait 3 seconds (simulating static noise), then skip
            setTimeout(function() {
                playNextVideo();
            }, 3000); 
        }
    }

    // --- LOGIC ---

    function playNextVideo() {
        currentVideoIndex++;

        if (currentVideoIndex < playlist.length) {
            console.log("Loading next video: " + playlist[currentVideoIndex]);
            
            // Load the new video
            player.loadVideoById(playlist[currentVideoIndex]);
            
            // Hide the error screen and show player again
            toggleErrorMode(false);
        } else {
            console.log("End of playlist.");
        }
    }

    // Helper function to swap between Video and Error Screen
    function toggleErrorMode(isError) {
        var errorScreen = document.getElementById('error-screen');
        var playerDiv = document.getElementById('player-div');

        if (isError) {
            // Hide player completely so no UI is seen
            playerDiv.style.visibility = 'hidden'; 
            // Show error screen
            errorScreen.classList.add('show-error');
        } else {
            // Show player
            playerDiv.style.visibility = 'visible';
            // Hide error screen
            errorScreen.classList.remove('show-error');
        }
    }

</script>

</body>
</html>
