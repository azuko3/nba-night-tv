name: Update TV Schedule

on:
  # 1. Standard Schedule (06:50 UTC = 08:50 Israel time)
  schedule:
    - cron: '55 6 * * *'
  
  # 2. Manual Trigger (Allows running manually from the Actions tab)
  workflow_dispatch:
  
  # 3. Push Trigger - Enabled only for workflow updates to ensure registration
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update_tv.yml'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install requests isodate

    - name: Fetch NBA Videos
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: python scripts/fetch_nba.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'TV Updater Bot'
        git config --global user.email 'bot@noreply.github.com'
        git add playlist.json
        # Check if there are changes before committing to avoid empty commit errors
        git diff --quiet && git diff --staged --quiet || (git commit -m "Daily Playlist Update" && git push)
